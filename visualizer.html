      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    frontier = [(heuristic[source_router], 0, source_router, [source_router])]
    best_cost = {source_router: 0}

    expanded = 0

    while frontier:
        f, cost, current, path = heapq.heappop(frontier)

        if current in visited:

        visited.add(current)

                heapq.heappush(

      const st = steps[stepIndex] || { visited: [], frontier: [], current: null, path: [] };
      const visitedSet = new Set(st.visited || []);
      const frontierSet = new Set(st.frontier || []);
      const pathSet = new Set(st.path || []);

      const pathEdges = new Set();
      if (st.path && st.path.length > 1) {
        for (let i = 0; i < st.path.length - 1; i++) {
          pathEdges.add(`${st.path[i]}--${st.path[i + 1]}`);
          pathEdges.add(`${st.path[i + 1]}--${st.path[i]}`);
        }
      }

      const nodeMap = {};
      net.nodes.forEach((n) => (nodeMap[n.id] = n));

      let markup = "";

      // Draw edges
      net.edges.forEach((e) => {
        const a = nodeMap[e.from];
        const b = nodeMap[e.to];
        const isPathEdge = pathEdges.has(`${e.from}--${e.to}`);
        const stroke = isPathEdge ? "#22c55e" : "#64748b";
        const width = isPathEdge ? 3.5 : 2;
        const mx = (a.x + b.x) / 2;
        const my = (a.y + b.y) / 2;

        markup += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${stroke}" stroke-width="${width}" />`;
        markup += `<rect x="${mx - 12}" y="${my - 10}" width="24" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" />`;
        markup += `<text x="${mx}" y="${my + 3}" text-anchor="middle" font-size="11" font-family="monospace" fill="#0f172a">${e.cost}</text>`;
      });

      // Draw nodes
      net.nodes.forEach((n) => {
        let fill = "#e2e8f0";
        let stroke = "#334155";
        if (pathSet.has(n.id)) {
          fill = "#22c55e";
          stroke = "#15803d";
        } else if (n.id === st.current) {
          fill = "#38bdf8";
          stroke = "#0369a1";
        } else if (visitedSet.has(n.id) || frontierSet.has(n.id)) {
          fill = "#93c5fd";
          stroke = "#1d4ed8";
        }

        const shortName = n.id.replace("Router_", "R_");
        markup += `<circle cx="${n.x}" cy="${n.y}" r="22" fill="${fill}" stroke="${stroke}" stroke-width="2.5" />`;
        markup += `<text x="${n.x}" y="${n.y + 4}" text-anchor="middle" font-size="11" font-weight="600" font-family="monospace" fill="#0f172a">${shortName}</text>`;
        markup += `<text x="${n.x}" y="${n.y + 36}" text-anchor="middle" font-size="10" font-family="monospace" fill="#475569">${n.id} (h=${n.h})</text>`;
      });

      svg.innerHTML = markup;
    }

    function renderStepInfo() {
      const st = steps[stepIndex] || { summary: "", stateText: "{}", finalText: "" };
      document.getElementById("stepIndicator").textContent = `Step ${stepIndex + 1} / ${Math.max(1, steps.length)}`;
      document.getElementById("stepSummary").textContent = st.summary;
      document.getElementById("stepState").textContent = st.stateText;
      document.getElementById("finalOutput").textContent = st.finalText;
    }

    function renderAll() {
      renderCode();
      renderSvg();
      renderStepInfo();
    }

    document.getElementById("networkSelect").addEventListener("change", (e) => {
      stopAutoPlay();
      selectedNetwork = e.target.value;
      rebuildSteps();
      renderAll();
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      stopAutoPlay();
      if (stepIndex > 0) {
        stepIndex -= 1;
        renderAll();
      }
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      stopAutoPlay();
      if (stepIndex < steps.length - 1) {
        stepIndex += 1;
        renderAll();
      }
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      stopAutoPlay();
      stepIndex = 0;
      renderAll();
    });

    document.getElementById("playBtn").addEventListener("click", () => {
      if (playTimer) {
        stopAutoPlay();
        return;
      }
      if (stepIndex >= steps.length - 1) {
        stepIndex = 0;
      }
      document.getElementById("playBtn").textContent = "Stop";
      playTimer = setInterval(() => {
        if (stepIndex < steps.length - 1) {
          stepIndex += 1;
          renderAll();
        } else {
          stopAutoPlay();
        }
      }, 750);
    });

    document.getElementById("copyBtn").addEventListener("click", () => {
      const text = FILES[selectedFileIdx].code;
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      const btn = document.getElementById("copyBtn");
      btn.textContent = "Copied";
      setTimeout(() => {
        btn.textContent = "Copy Code";
      }, 1200);
    });

    renderTabs();
    rebuildSteps();
    renderAll();
  </script>
</body>
</html>
